<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dopamine Menu Planner · ADHD Dopamenu</title>
<style>
:root{--bg:#EFEBF2;--paper:#FFFFFF;--tx:#2A1F33;--tx2:#5F5468;--line:#E2DCE7;--pri:#372444;--pri2:#7E6886;--soft:#DAD4DF;--soft2:#F6F3F8;
--app:#DCE7DE;--appk:#2F7A57;--main:#D3CADF;--maink:#7E6886;--side:#BAB0C3;--sidek:#5E4874;--des:#EBD3DC;--desk:#9A4561;--spec:#E6E1EA;--speck:#494949;
--ok:#2F7A57;--okbg:#DCE7DE;--bad:#9A4561;--badbg:#EBD3DC;--sh:0 1px 2px rgba(21,58,76,.06),0 10px 26px rgba(21,58,76,.08);--serif:Georgia,"Iowan Old Style",serif;--sans:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
html[data-theme=dark]{--bg:#1A1220;--paper:#261A30;--tx:#EFEFEF;--tx2:#C7B9D1;--line:#3A2B45;--soft:#33263F;--soft2:#2C2036;--app:#1F4637;--appk:#8FCFAE;--main:#3A2B45;--maink:#D3C6DF;--side:#3A2E4A;--sidek:#C2B5E8;--des:#4A2A38;--desk:#F0A69B;--spec:#352B3D;--speck:#D5D5D5;--ok:#8FCFAE;--okbg:#1F4637;--bad:#F0A69B;--badbg:#4A2A38;--pri2:#A48FB0;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri2)}
.app{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:var(--pri);color:#E9E2EE;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;z-index:60}
html[data-theme=dark] #side{background:#150D1A}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 18px}.brand img{width:44px;height:44px;border-radius:12px}.brand b{font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.15;color:#fff}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#E9E2EE;padding:10px 12px;border-radius:12px;margin:2px 0;font-weight:600;text-align:left}
.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:#DAD4DF;color:var(--pri)}.nv .ic{width:20px;height:20px;display:flex}.nv .ic svg{width:20px;height:20px}
.nv .cnt{margin-left:auto;background:#DAD4DF;color:var(--pri);font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.sfoot{margin-top:auto;font-size:12px;color:#C3B5CE;padding:12px 8px 0}
main{flex:1;min-width:0;padding:22px 28px 60px}#view,header.top{max-width:1280px;margin-left:auto;margin-right:auto}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0}
header.top h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center}.ib svg{width:19px;height:19px}.ib.ham{display:none}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--tx)}
.btn.t{background:var(--pri);color:#fff}html[data-theme=dark] .btn.t{background:var(--pri2)}.btn.sm{padding:7px 12px;font-size:13px}.btn.ghost{background:none;border:1.5px solid var(--line)}.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .chip.on{background:var(--pri2);border-color:var(--pri2)}
#sampleChip{background:var(--des);border-color:transparent;color:var(--desk);font-weight:700}
.card{background:var(--paper);border-radius:20px;box-shadow:var(--sh);padding:18px}
.k{font-weight:700;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.k .r{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--tx2)}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g32{grid-template-columns:1.55fr 1fr}
.mut{color:var(--tx2)}.small{font-size:12.5px}.empty{color:var(--tx2);text-align:center;padding:22px 10px;font-size:13.5px}
.stat{border-radius:20px;padding:16px 18px;box-shadow:var(--sh)}.stat span{font-size:12.5px;font-weight:700;color:var(--tx2);display:block}.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;margin:4px 0 0;line-height:1.1}.stat em{font-style:normal;font-size:12px;color:var(--tx2)}
.stat.dark{background:var(--pri);color:#fff}.stat.dark span,.stat.dark em{color:#D8CCE0}html[data-theme=dark] .stat.dark{background:#150D1A}
.c-app{background:var(--app)}.c-main{background:var(--main)}.c-side{background:var(--side)}.c-des{background:var(--des)}.c-spec{background:var(--spec)}
.k-app{color:var(--appk)}.k-main{color:var(--maink)}.k-side{color:var(--sidek)}.k-des{color:var(--desk)}.k-spec{color:var(--speck)}
/* hero */
.hero{background:var(--paper);border-radius:26px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.htop{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:22px 24px 6px}
.htop h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0;line-height:1.05}.hsub{font-size:13px;font-weight:700;color:var(--tx2);margin-top:4px}.htop p{margin:6px 0 0;color:var(--tx2)}
.feel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.feel>span{font-size:13px;font-weight:700;color:var(--tx2);margin-right:2px}
.scene{position:relative;padding:0 8px}.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer}.hot .lift{transition:transform .25s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:center bottom}.hot:hover .lift{transform:translateY(-6px)}.hot:hover .lbl rect{fill:#494949}
.objgrid{display:none}
/* page hero */
.phero{background:var(--pri);color:#fff;border-radius:22px;padding:16px 20px;display:flex;gap:18px;align-items:center;margin-bottom:12px;box-shadow:var(--sh)}html[data-theme=dark] .phero{background:#150D1A}html[data-theme=dark] .scene{padding:0 8px 8px}html[data-theme=dark] .scene svg{border-radius:18px}
.phero .pa{width:88px;height:88px;flex:0 0 88px;border-radius:20px;background:#F6F3F8;display:flex;align-items:center;justify-content:center}.phero .pa svg{width:78px;height:78px}
.phero p{margin:0;font-family:var(--serif);font-size:20px;line-height:1.3;flex:1}
.how{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 38px 10px 14px;margin-bottom:16px;position:relative;flex-wrap:wrap}
.how .st{display:flex;gap:8px;align-items:center;font-size:13px;flex:1;min-width:190px}.how .st i{font-style:normal;width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--pri);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.how .hx{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--tx2);padding:4px 6px}
.howbtn{border:0;background:var(--soft);color:var(--tx2);font-size:12px;font-weight:700;border-radius:99px;padding:6px 12px;margin-bottom:14px}
/* menu card */
.menu{background:var(--paper);border-radius:24px;box-shadow:var(--sh);padding:28px 30px;position:relative}
.menu .mh{text-align:center;margin-bottom:18px}.menu .mh h3{font-family:var(--serif);font-weight:400;font-size:34px;margin:0}.menu .mh span{font-size:12.5px;color:var(--tx2);font-weight:700}
.menu .orn{display:block;width:120px;height:2px;background:var(--line);margin:10px auto 0}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:22px 34px}
.course h4{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 2px}.course h4 .cico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}.course h4 .cico svg{width:30px;height:30px}
.course .cd{font-size:12.5px;color:var(--tx2);margin:0 0 8px}
.dish{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line)}.dish b{font-weight:600}.dish .dots{flex:1}.dish .pr{font-size:12px;color:var(--tx2);white-space:nowrap}.dish .acts{opacity:0;transition:opacity .15s}.dish:hover .acts{opacity:1}
.dish .fav{color:#9A4561;font-size:12px}
.acts{display:flex;gap:2px}.acts button{width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--tx2);display:flex;align-items:center;justify-content:center}.acts button:hover{background:var(--soft)}.acts svg{width:15px;height:15px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
/* order */
.opt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pick{display:flex;gap:14px;align-items:center;border-radius:18px;padding:14px;margin-bottom:10px;border:0;width:100%;text-align:left}
.pick .pi{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center}.pick .pi svg{width:44px;height:44px}
html[data-theme=dark] .pick .pi{background:rgba(255,255,255,.1)}
.pick .mn{flex:1;min-width:0}.pick .mn b{display:block;font-size:15.5px}.pick .mn span{font-size:12.5px;color:var(--tx2)}
.wheel{position:relative;width:260px;height:260px;margin:0 auto}.wheel svg{width:260px;height:260px;transition:transform 2.6s cubic-bezier(.15,.85,.2,1)}.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--pri);z-index:2}
.wheel .hub{position:absolute;inset:0;margin:auto;width:70px;height:70px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-weight:800;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.moods{display:flex;gap:6px;flex-wrap:wrap}.moods button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;min-width:62px}.moods button i{font-style:normal;font-size:22px}.moods button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* log */
.lrow{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}.lrow:last-child{border:0}.lrow .tm{width:52px;font-size:12px;font-weight:700;color:var(--tx2)}
.lrow .dot{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center}.lrow .dot svg{width:30px;height:30px}
.lrow .mn{flex:1;min-width:0}.lrow .mn b{display:block}.lrow .mn span{font-size:12.5px;color:var(--tx2)}
.lift-x{font-weight:800;font-size:13px;white-space:nowrap}.lift-x.up{color:var(--ok)}.lift-x.dn{color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.rk:last-child{border:0}.rk>b{width:24px;height:24px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11.5px}.rk .mn{flex:1;min-width:0;font-weight:600}.rk .mn small{display:block;font-weight:500;color:var(--tx2);font-size:11.5px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}.chart .stk{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden}.chart span{font-size:11.5px;color:var(--tx2)}.chart em{font-style:normal;font-size:11px;font-weight:700}
.idea{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--soft2);margin-bottom:6px}.idea .mn{flex:1;min-width:0}.idea .mn b{display:block;font-weight:600;font-size:13.5px}.idea .mn span{font-size:12px;color:var(--tx2)}
.pend{display:flex;align-items:center;gap:12px;background:var(--side);border-radius:16px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:10px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
/* modal & toast */
#mw{position:fixed;inset:0;background:rgba(16,35,44,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}#mw.on{display:flex}
#mb{background:var(--paper);border-radius:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:22px}#mb h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fgrid label{font-size:12.5px;font-weight:700;color:var(--tx2);display:flex;flex-direction:column;gap:5px}.fgrid .w{grid-column:1/-1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.cks{display:flex;gap:6px;flex-wrap:wrap}.cks label{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--tx);cursor:pointer}.cks input{width:auto;accent-color:var(--pri)}
.swg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.sw{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}.sw span{width:34px;height:34px;border-radius:50%}.sw b{font-size:12px}.sw.on{outline:2.5px solid var(--pri)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--pri);color:#fff;border-radius:99px;padding:11px 20px;font-weight:700;z-index:300;transition:transform .3s;max-width:92vw;text-align:center}#toast.on{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:250}
.note{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;margin-top:12px}
.scrim{display:none}
@media(max-width:1180px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
 #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}#side.on{transform:none}
 .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
 .ib.ham{display:flex}main{padding:12px 14px 60px}header.top h1{font-size:21px}
 .g2,.g3,.g32,.mcols{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr;gap:12px}
 .htop{padding:16px 16px 4px}.htop h2{font-size:26px}.hide-m{display:none!important}
 .scene .objs{display:none}.sc-d{display:none!important}.sc-m{display:block!important}
 .objgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px 14px}
 .objgrid button{border:0;background:var(--soft2);border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px}.objgrid svg{width:56px;height:56px}
 .phero{padding:12px}.phero .pa{width:62px;height:62px;flex:0 0 62px}.phero .pa svg{width:54px;height:54px}.phero p{font-size:16px}
 .stat b{font-size:22px}.how .st{min-width:100%}.menu{padding:20px 16px}.dish .acts{opacity:1}.wheel,.wheel svg{width:230px;height:230px}.swg{grid-template-columns:repeat(3,1fr)}
}
.sc-m{display:none!important}
@media(max-width:420px){.fgrid{grid-template-columns:1fr}#thB,#prB{display:none}}
@media print{#side,header.top .ib,header.top .btn,header.top .chip,.phero,.how,.howbtn,.acts,.no-print{display:none!important}main{padding:0}.card,.hero,.menu,.stat{box-shadow:none!important;border:1px solid #ddd}body{background:#fff}}

function orderM(id){const x=I_(id);openM('<h3>'+esc(x.t)+'</h3><p class="small mut" style="margin:-6px 0 14px">'+CN[x.c]+' · '+tLbl(x.min)+'</p><div class="k">How do you feel before?</div><div class="moods" id="mb4">'+MOOD.map((m,i)=>'<button onclick="document.querySelectorAll(\'#mb4 button\').forEach(b=>b.classList.remove(\'on\'));this.classList.add(\'on\');window._bf='+(i+1)+'"><i>'+m+'</i>'+['Awful','Low','Okay','Good','Great'][i]+'</button>').join('')+'</div><div class="mfoot"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn t" onclick="placeOrder(\''+id+'\')">Order it ✦</button></div>');window._bf=3;document.querySelectorAll('#mb4 button')[2].classList.add('on')}
function placeOrder(id){const x=I_(id);S.log.push({id:uid(),d:TD(),at:nowT(),item:id,c:x.c,t:x.t,before:window._bf||3,after:null,need:S.filters.need||''});save();closeM();rerender();confetti(40);toast('Enjoy '+x.t+'! Rate how you feel afterwards ✦')}
function rate(lid,v){const l=S.log.find(x=>x.id===lid);if(!l)return;l.after=v;save();closeM();rerender();const d=v-l.before;toast(d>0?'Mood up by '+d+' ✦ Noted!':d<0?'Noted. Not every dish works every time.':'Noted ✓')}
function rateM(lid){const l=S.log.find(x=>x.id===lid);openM('<h3>How do you feel now?</h3><p class="small mut" style="margin:-6px 0 14px">After '+esc(l.t)+'. Before you felt '+MOOD[l.before-1]+'.</p><div class="moods">'+MOOD.map((m,i)=>'<button onclick="rate(\''+lid+'\','+(i+1)+')"><i>'+m+'</i>'+['Awful','Low','Okay','Good','Great'][i]+'</button>').join('')+'</div><div class="mfoot"><button class="btn ghost" onclick="closeM()">Later</button></div>')}
function delLog(id){if(!confirm('Remove this order from your log?'))return;S.log=S.log.filter(x=>x.id!==id);save();rerender()}
let spinDeg=0;
V.order=()=>{const f=S.filters;const sug=suggest(f,4);const W=suggest(f,8);
 return '<div class="g g32"><div class="card"><div class="k">How do you feel?</div><div class="opt">'+NEEDS.map(n=>'<button class="chip'+(f.need===n[0]?' on':'')+'" onclick="S.filters.need=S.filters.need===\''+n[0]+'\'?\'\':\''+n[0]+'\';save();rerender()">'+n[1]+' '+n[2]+'</button>').join('')+'</div>'
 +'<div class="k">How much time?</div><div class="opt">'+[5,15,30,60,180].map(m=>'<button class="chip'+(+f.time===m?' on':'')+'" onclick="S.filters.time='+m+';save();rerender()">'+(m<60?m+' min':m/60+' h')+'</button>').join('')+'</div>'
 +'<div class="k">Energy right now?</div><div class="opt">'+ENG.map(e=>'<button class="chip'+(f.energy===e[0]?' on':'')+'" onclick="S.filters.energy=\''+e[0]+'\';save();rerender()">'+e[1]+'</button>').join('')+'</div>'
 +'<div class="k" style="margin-top:10px">Chef’s picks for you</div>'+(sug.map(o=>pickCard(o)).join('')||'<div class="empty">Nothing on your menu fits. Try more time or add dishes.</div>')+'</div>'
 +'<div class="card" style="text-align:center"><div class="k">Can’t decide? Spin.</div><div class="wheel"><span class="ptr"></span>'+wheelSVG(W)+'<button class="hub" onclick="spin()">SPIN</button></div><div id="spinOut" style="margin-top:16px;min-height:80px"></div><p class="small mut">The wheel only uses dishes that fit your time and energy.</p></div></div>'};
function wheelSVG(W){const n=Math.max(W.length,1);const col={app:'#DCE7DE',main:'#D3CADF',side:'#BAB0C3',des:'#EBD3DC',spec:'#E6E1EA'};let g='';
 if(!W.length)return '<svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="124" fill="#E6E1EA"/></svg>';
 W.forEach((o,i)=>{const a1=i/n*2*Math.PI-Math.PI/2,a2=(i+1)/n*2*Math.PI-Math.PI/2;const big=a2-a1>Math.PI?1:0;const mid=(a1+a2)/2;g+=`<path d="M130 130L${130+124*Math.cos(a1)} ${130+124*Math.sin(a1)}A124 124 0 ${big} 1 ${130+124*Math.cos(a2)} ${130+124*Math.sin(a2)}Z" fill="${col[o.x.c]}" stroke="#fff" stroke-width="2"/><text x="${130+80*Math.cos(mid)}" y="${130+80*Math.sin(mid)}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#372444" transform="rotate(${mid*180/Math.PI} ${130+80*Math.cos(mid)} ${130+80*Math.sin(mid)})">${esc(o.x.t.length>16?o.x.t.slice(0,15)+'…':o.x.t)}</text>`});
 return `<svg id="wsv" viewBox="0 0 260 260" style="transform:rotate(${spinDeg}deg)"><circle cx="130" cy="130" r="128" fill="#372444"/>${g}</svg>`}
function spin(){const W=suggest(S.filters,8);if(!W.length){toast('Nothing fits right now. Add dishes or allow more time.');return}const n=W.length;const k=Math.floor(Math.random()*n);
 const target=360-((k+.5)/n*360);spinDeg=spinDeg-(spinDeg%360)+360*5+target;const el=$('#wsv');if(el)el.style.transform='rotate('+spinDeg+'deg)';const o=$('#spinOut');if(o)o.innerHTML='<span class="mut small">Spinning…</span>';
 setTimeout(()=>{const x=W[k].x;const out=$('#spinOut');if(out)out.innerHTML='<div class="small mut">The menu says:</div><b style="font-family:var(--serif);font-size:24px;font-weight:400">'+esc(x.t)+'</b><div style="margin-top:8px"><button class="btn t" onclick="orderM(\''+x.id+'\')">Order it</button></div>';confetti(30)},2700)}
/* ================= MENU ================= */
V.menu=()=>{const nm=S.profile.name;
 return '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap" class="no-print"><button class="btn t" onclick="editItem()">'+IC.plus+' Add a dish</button><button class="btn" onclick="go(\'ideas\')">'+IC.ideas+' Get ideas</button><button class="btn" onclick="print()">'+IC.print+' Print my menu</button></div>'
 +'<div class="menu"><div class="mh"><span>'+(nm?esc(nm)+'’s':'My')+'</span><h3>Dopamine Menu</h3><span class="orn"></span></div><div class="mcols">'+CATS.map(c=>{const L=S.items.filter(x=>x.c===c[0]);return '<div class="course" id="cs-'+c[0]+'"><h4><span class="cico c-'+c[0]+'">'+catSVG(c[0])+'</span>'+c[1]+'</h4><p class="cd">'+c[2]+'</p>'+(L.map(x=>{const st=stats(x.id);return '<div class="dish"><b>'+esc(x.t)+'</b>'+(x.fav?'<span class="fav">♥</span>':'')+'<span class="dots"></span><span class="pr">'+(c[0]==='side'?'with any task':tLbl(x.min))+(st?' · '+(st.lift>=0?'+':'')+st.lift.toFixed(1):'')+'</span><div class="acts no-print">'+(c[0]!=='side'&&c[0]!=='spec'?'<button title="Order now" onclick="orderM(\''+x.id+'\')">'+IC.order+'</button>':'')+'<button title="Edit" onclick="editItem(\''+x.id+'\')">'+IC.edit+'</button></div></div>'}).join('')||'<div class="small mut" style="padding:6px 0">Nothing here yet. <a href="#" onclick="editItem(null,\''+c[0]+'\');return false">Add one</a></div>')+'</div>'}).join('')+'</div></div>'};
function editItem(id,cat){const x=id?I_(id):{c:cat||'app',t:'',min:5,energy:'low',needs:[],fav:false};
 openM('<h3>'+(id?'Edit dish':'Add a dish')+'</h3><div class="fgrid"><label class="w">What is it?<input id="f_t" value="'+esc(x.t)+'" placeholder="e.g. Dance to one song"></label><label>Course<select id="f_c">'+CATS.map(c=>'<option value="'+c[0]+'"'+(x.c===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')+'</select></label><label>Minutes<input id="f_m" type="number" min="0" value="'+x.min+'"></label><label>Energy needed<select id="f_e">'+ENG.map(e=>'<option value="'+e[0]+'"'+(x.energy===e[0]?' selected':'')+'>'+e[1]+'</option>').join('')+'</select></label><label><span>Favourite</span><span class="cks"><label><input type="checkbox" id="f_f"'+(x.fav?' checked':'')+'> ♥ yes</label></span></label><div class="w"><div style="font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:6px">Good when I feel…</div><div class="cks">'+NEEDS.map(n=>'<label><input type="checkbox" class="f_n" value="'+n[0]+'"'+(x.needs.includes(n[0])?' checked':'')+'>'+n[1]+' '+n[2]+'</label>').join('')+'</div></div></div><div class="mfoot">'+(id?'<button class="btn ghost" style="margin-right:auto;color:var(--bad)" onclick="delItem(\''+id+'\')">Delete</button>':'')+'<button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn t" onclick="saveItem(\''+(id||'')+'\')">Save</button></div>');setTimeout(()=>{const e=$('#f_t');if(e)e.focus()},50)}
function saveItem(id){const o={t:$('#f_t').value.trim(),c:$('#f_c').value,min:Math.max(0,+$('#f_m').value||0),energy:$('#f_e').value,fav:$('#f_f').checked,needs:[...document.querySelectorAll('.f_n:checked')].map(x=>x.value)};if(!o.t){toast('Give the dish a name');return}
 if(id)Object.assign(I_(id),o);else S.items.push(Object.assign({id:uid(),added:TD()},o));save();closeM();rerender();toast('Saved ✓')}
function delItem(id){if(!confirm('Delete this dish? Your past orders stay in the log.'))return;S.items=S.items.filter(x=>x.id!==id);save();closeM();rerender()}
/* ================= PAIR ================= */
V.pair=()=>{if(!S.pairs)S.pairs=[];const sides=S.items.filter(x=>x.c==='side');
 return '<div class="g g32"><div class="card"><div class="k">Pair a task<span class="r">'+S.pairs.filter(p=>!p.done).length+' open</span></div><div class="fgrid" style="grid-template-columns:1.4fr 1fr auto;align-items:end"><label>Task I’m avoiding<input id="pt" placeholder="e.g. Answer emails"></label><label>With a side<select id="ps">'+sides.map(s=>'<option value="'+s.id+'">'+esc(s.t)+'</option>').join('')+'<option value="">(no side)</option></select></label><button class="btn t" onclick="addPair()">Pair it</button></div>'
 +'<div style="margin-top:14px">'+(S.pairs.slice().reverse().map(p=>{const s=I_(p.side);return '<div class="lrow"><button class="ib" style="width:34px;height:34px;'+(p.done?'background:var(--ok);color:#fff;border-color:var(--ok)':'')+'" onclick="pairT(\''+p.id+'\')" aria-label="Done">'+IC.check+'</button><div class="mn"><b style="'+(p.done?'text-decoration:line-through;color:var(--tx2)':'')+'">'+esc(p.task)+'</b><span>'+(s?'with '+esc(s.t):'no side')+(p.done?' · done '+(p.done===TD()?'today':dago(p.done)+' days ago'):'')+'</span></div><div class="acts"><button onclick="S.pairs=S.pairs.filter(q=>q.id!==\''+p.id+'\');save();rerender()">'+IC.trash+'</button></div></div>'}).join('')||'<div class="empty">Pair the task you keep putting off. It gets easier with a side.</div>')+'</div></div>'
 +'<div class="card"><div class="k">Your sides<span class="r"><button class="btn sm" onclick="editItem(null,\'side\')">'+IC.plus+' Add</button></span></div>'+(sides.map(s=>'<div class="idea"><span class="dot c-side" style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center">'+catSVG('side').replace('<svg','<svg width="28" height="28"')+'</span><div class="mn"><b>'+esc(s.t)+'</b><span>used '+(S.pairs.filter(p=>p.side===s.id).length)+' times</span></div></div>').join('')||'<div class="empty">No sides yet.</div>')+'<div class="note">Ideas that pair with almost anything: music, a podcast, a friend on a call (body doubling), a timer race, or working somewhere new.</div></div></div>'};
function addPair(){const t=$('#pt').value.trim();if(!t){toast('Type the task first');return}if(!S.pairs)S.pairs=[];S.pairs.push({id:uid(),task:t,side:$('#ps').value,made:TD(),done:''});save();rerender();toast('Paired ✓ Start with just 5 minutes')}
function pairT(id){const p=S.pairs.find(x=>x.id===id);p.done=p.done?'':TD();if(p.done){const s=I_(p.side);S.log.push({id:uid(),d:TD(),at:nowT(),item:p.side||'',c:'side',t:p.task+(s?' + '+s.t:''),before:3,after:null,need:'stuck'});confetti(40);toast('Done! That was the hard part ✦')}save();rerender()}

V.specials=()=>{const L=S.items.filter(x=>x.c==='spec');const t=today();
 return '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn t" onclick="editItem(null,\'spec\')">'+IC.plus+' Add a special</button></div><div class="g g3">'+(L.map(x=>{const dd=x.date?Math.round((pd(x.date)-t)/864e5):null;return '<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="dot c-spec" style="width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center">'+catSVG('spec').replace('<svg','<svg width="48" height="48"')+'</span><div style="flex:1;min-width:0"><b style="font-family:var(--serif);font-size:19px;font-weight:400;display:block">'+esc(x.t)+'</b><span class="small mut">'+tLbl(x.min)+'</span></div></div><div style="margin:14px 0 10px">'+(dd==null?'<span class="tag" style="background:var(--soft)">No date yet</span>':dd>0?'<b style="font-family:var(--serif);font-size:30px;font-weight:400">'+dd+'</b> <span class="mut">day'+(dd===1?'':'s')+' to go · '+pd(x.date).getDate()+' '+MS[pd(x.date).getMonth()]+'</span>':dd===0?'<b>✦ It’s today! Enjoy it.</b>':'<span class="tag" style="background:var(--okbg);color:var(--ok)">✓ Enjoyed '+(-dd)+' days ago</span>')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap"><input type="date" value="'+(x.date||'')+'" style="flex:1;min-width:140px" onchange="I_(\''+x.id+'\').date=this.value;save();rerender()"><button class="btn sm" onclick="editItem(\''+x.id+'\')">'+IC.edit+'</button></div></div>'}).join('')||'<div class="card empty" style="grid-column:1/-1">No specials yet. What would you love to look forward to?</div>')+'</div>'};

 return (pend.length?'<div class="pend"><b>'+pend.length+' order'+(pend.length>1?'s':'')+' to rate</b><span class="small">Rating helps the menu learn what works for you.</span><button class="btn sm t" style="margin-left:auto" onclick="rateM(\''+pend[0].id+'\')">Rate now</button></div>':'')
 +'<div class="opt"><button class="chip'+(lgF==='all'?' on':'')+'" onclick="lgF=\'all\';rerender()">All · '+S.log.length+'</button>'+CATS.map(c=>'<button class="chip'+(lgF===c[0]?' on':'')+'" onclick="lgF=\''+c[0]+'\';rerender()">'+c[1]+'</button>').join('')+'<button class="btn sm" style="margin-left:auto" onclick="csv()">Export CSV</button></div>'
 +'<div class="card">'+(Object.keys(byD).map(d=>{const dd=pd(d);return '<div class="k" style="margin-top:6px">'+(d===TD()?'Today':dago(d)===1?'Yesterday':DW[dd.getDay()]+', '+dd.getDate()+' '+MS[dd.getMonth()])+'<span class="r">'+byD[d].length+'</span></div>'+byD[d].map(logRow).join('')}).join('')||'<div class="empty">No orders yet.</div>')+'</div>'};
function csv(){const rows=[['Date','Time','Course','Dish','Mood before','Mood after']].concat(S.log.slice().sort((a,b)=>(a.d+a.at).localeCompare(b.d+b.at)).map(x=>[x.d,x.at,CN[x.c],x.t,x.before,x.after==null?'':x.after]));const s=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='dopamine-menu-log-'+TD()+'.csv';a.click()}

V.insights=()=>{const R=S.items.map(x=>({x,s:stats(x.id)})).filter(o=>o.s);const top=R.slice().sort((a,b)=>b.s.lift-a.s.lift||b.s.n-a.s.n).slice(0,6);const low=R.filter(o=>o.s.n>=2&&o.s.lift<=0).sort((a,b)=>a.s.lift-b.s.lift).slice(0,3);
 const days=[...Array(7)].map((_,i)=>addD(i-6));const col={app:'#DCE7DE',main:'#D3CADF',side:'#BAB0C3',des:'#EBD3DC',spec:'#E6E1EA'};const mx=Math.max(1,...days.map(d=>S.log.filter(x=>x.d===d).length));
 const wk=S.log.filter(x=>dago(x.d)<14);const share=CATS.map(c=>[c,wk.filter(x=>x.c===c[0]).length]);const tot=Math.max(1,wk.length);
 const byNeed=NEEDS.map(n=>{const L=S.log.filter(x=>x.need===n[0]&&x.after!=null);return [n,L.length?L.reduce((s,x)=>s+x.after-x.before,0)/L.length:null,L.length]}).filter(x=>x[2]);

 +(low.length?'<div class="note">Not helping much lately: '+low.map(o=>'<b>'+esc(o.x.t)+'</b>').join(', ')+'. Maybe swap one for a Main.</div>':'')+'</div>'
 +'<div class="card"><div class="k">Your course balance<span class="r">last 14 days</span></div>'+share.map(([c,n])=>'<div style="display:flex;align-items:center;gap:10px;margin:9px 0"><span style="width:92px;font-weight:600;font-size:13px">'+c[1]+'</span><div class="bar" style="flex:1"><i style="width:'+n/tot*100+'%;background:'+({app:'#2F7A57',main:'#7E6886',side:'#5E4874',des:'#9A4561',spec:'#494949'})[c[0]]+'"></i></div><span style="width:40px;text-align:right;font-weight:700;font-size:13px">'+Math.round(n/tot*100)+'%</span></div>').join('')+'<div class="note">A balanced menu has plenty of Appetizers and Mains, Sides when you work, and Desserts in small portions.</div></div></div>'
 +'<div class="g g2"><div class="card"><div class="k">Orders per day</div><div class="chart">'+days.map(d=>{const L=S.log.filter(x=>x.d===d);const dd=pd(d);return '<div><em>'+(L.length||'')+'</em><div class="stk" style="height:'+L.length/mx*110+'px">'+CATS.map(c=>{const n=L.filter(x=>x.c===c[0]).length;return n?'<i style="display:block;height:'+n/Math.max(1,L.length)*100+'%;background:'+col[c[0]]+'"></i>':''}).join('')+'</div><span>'+DW[dd.getDay()]+'</span></div>'}).join('')+'</div><div class="legend">'+CATS.map(c=>'<span><i style="background:'+col[c[0]]+'"></i>'+c[1]+'</span>').join('')+'</div></div>'

V.ideas=()=>{const have=new Set(S.items.map(x=>x.t.toLowerCase()));let L=IDEAS.filter(x=>(idF==='all'||x[0]===idF)&&(!idN||x[4].split(' ').includes(idN)));
 return '<div class="opt"><button class="chip'+(idF==='all'?' on':'')+'" onclick="idF=\'all\';rerender()">All</button>'+CATS.map(c=>'<button class="chip'+(idF===c[0]?' on':'')+'" onclick="idF=\''+c[0]+'\';rerender()">'+c[1]+'</button>').join('')+'</div><div class="opt"><span class="small mut" style="align-self:center">Good when I feel:</span>'+NEEDS.map(n=>'<button class="chip'+(idN===n[0]?' on':'')+'" onclick="idN=idN===\''+n[0]+'\'?\'\':\''+n[0]+'\';rerender()">'+n[1]+' '+n[2]+'</button>').join('')+'</div>'
 +'<div class="g g3">'+CATS.filter(c=>idF==='all'||idF===c[0]).map(c=>{const I=L.filter(x=>x[0]===c[0]);if(!I.length)return '';return '<div class="card"><div class="k"><span class="dot c-'+c[0]+'" style="width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center">'+catSVG(c[0]).replace('<svg','<svg width="24" height="24"')+'</span>'+c[1]+'<span class="r">'+I.length+'</span></div>'+I.map(x=>{const on=have.has(x[1].toLowerCase());const i=IDEAS.indexOf(x);return '<div class="idea"><div class="mn"><b>'+x[1]+'</b><span>'+(c[0]==='side'?'with any task':tLbl(x[2]))+' · '+x[3]+' energy</span></div>'+(on?'<span class="tag" style="background:var(--okbg);color:var(--ok)">✓ on menu</span>':'<button class="btn sm t" onclick="addIdea('+i+')">＋</button>')+'</div>'}).join('')+'</div>'}).join('')+'</div>'};
function addIdea(i){const x=IDEAS[i];S.items.push(mk(x[0],x[1],x[2],x[3],x[4]));save();rerender();toast('Added to '+CN[x[0]]+' ✓')}
/* ================= SETTINGS & THEMES ================= */
const THEMES=[['navy','Orchid','#372444','#7E6886'],['forest','Forest','#1F4D3A','#3A6B55'],['plum','Plum','#3E2A4F','#5E4874'],['slate','Slate','#2F3A45','#4E5B68'],['berry','Berry','#5A2333','#7A3A4C']];
const TH=()=>THEMES.find(t=>t[0]===(S.profile.color||'navy'))||THEMES[0];
function applyTheme(){document.documentElement.dataset.theme=S.profile.theme==='dark'?'dark':'light';const t=TH();const r=document.documentElement.style;r.setProperty('--pri',t[2]);if(S.profile.theme!=='dark')r.setProperty('--pri2',t[3]);else r.removeProperty('--pri2');C.navy=t[2];C.navy2=t[3]}
function toggleTheme(){S.profile.theme=S.profile.theme==='dark'?'light':'dark';save();applyTheme();rerender()}
function colorM(){openM('<h3>Colour theme</h3><div class="swg">'+THEMES.map(t=>'<button class="sw'+(TH()[0]===t[0]?' on':'')+'" onclick="S.profile.color=\''+t[0]+'\';save();applyTheme();closeM();rerender();toast(\''+t[1]+' theme ✓\')"><span style="background:'+t[2]+'"></span><b>'+t[1]+'</b></button>').join('')+'</div><div class="k" style="margin-top:18px">Mode</div><div style="display:flex;gap:8px"><button class="chip'+(S.profile.theme!=='dark'?' on':'')+'" onclick="S.profile.theme=\'light\';save();applyTheme();colorM();rerender()">☀ Light</button><button class="chip'+(S.profile.theme==='dark'?' on':'')+'" onclick="S.profile.theme=\'dark\';save();applyTheme();colorM();rerender()">☾ Dark</button></div><div class="mfoot"><button class="btn t" onclick="closeM()">Done</button></div>')}
V.settings=()=>'<div class="g g2"><div class="card"><div class="k">You</div><div class="fgrid"><label class="w">Your name<input id="s_n" value="'+esc(S.profile.name)+'"></label></div><div class="mfoot" style="justify-content:flex-start"><button class="btn t" onclick="S.profile.name=$(\'#s_n\').value.trim();save();toast(\'Saved ✓\')">Save</button><button class="btn" onclick="colorM()">'+IC.palette+' Colour theme</button></div>'
 +'<div class="k" style="margin-top:20px">Start fresh</div><p class="small mut">'+(S._own?'You are using your own menu.':'You are looking at a sample menu (Sam’s).')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap">'+(S._own?'':'<button class="btn t" onclick="startOwn()">✦ Clear sample &amp; start my own</button>')+'<button class="btn ghost" onclick="if(confirm(\'Load the sample? This replaces your data.\')){S=sample();fix();save();go(\'today\')}">Load the sample</button></div></div>'
 +'<div class="card"><div class="k">Backup</div><p class="small mut" style="margin-top:0">Your menu lives in this browser on this device. Download a backup now and then, or to move it to another device.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn t" onclick="backup()">Download backup</button><label class="btn" style="cursor:pointer">Restore backup<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div><p class="small mut" style="margin-top:16px">A dopamine menu is a self-care tool, not medical advice or ADHD treatment.</p></div></div>';
function startOwn(){if(!confirm('Clear the sample and start your own menu?'))return;const p=S.profile;S=blank();S._own=true;S.profile.theme=p.theme;S.profile.color=p.color;fix();save();applyTheme();go('ideas');toast('Your menu is empty ✦ Add ideas with ＋, or write your own')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='dopamine-menu-backup-'+TD()+'.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.items))throw 0;S=o;fix();save();applyTheme();go('today');toast('Restored ✓')}catch(e){toast('That file is not a Dopamine Menu backup')}};r.readAsText(f);inp.value=''}
/* ================= ui ================= */
function openM(h){$('#mb').innerHTML=h;$('#mw').classList.add('on')}function closeM(){$('#mw').classList.remove('on')}
let tT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),2800)}
function confetti(n){const cv=$('#confetti'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const col=['#372444','#DCE7DE','#D3CADF','#BAB0C3','#EBD3DC','#7E6886'];const ps=[...Array(n||80)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*13,vy:-Math.random()*10-3,r:Math.random()*6+4,c:col[Math.floor(Math.random()*col.length)],a:Math.random()*6}));let f=0;
 (function st(){c.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.5);c.restore()});if(++f<90)requestAnimationFrame(st);else c.clearRect(0,0,cv.width,cv.height)})()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('.ham').innerHTML=IC.hamb;$('#thB').innerHTML=IC.moon;$('#gB').innerHTML=IC.gear;$('#prB').innerHTML=IC.print;$('#clB').innerHTML=IC.palette;$('#orB').innerHTML=IC.order+'<span class="hide-m">Order now</span>';
applyTheme();go('today');
